<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page d'inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
            crossorigin="anonymous"></script>
    <link href="css/index.css" rel="stylesheet"/>
</head>
<body>
<div class="container">
    <h1 class="mb-4">Créer un compte</h1>
    <form action="/ma-page-de-traitement" method="post">
        <div class="mb-3">
            <label for="name" class="form-label">Nom:</label>
            <input type="text" id="name" name="user_name" class="form-control" required />
        </div>

        <div class="mb-3">
            <label for="lastname" class="form-label">Prénom:</label>
            <input type="text" id="lastname" name="user_lastname" class="form-control" required />
        </div>

        <div class="mb-3">
            <label for="username" class="form-label">Nom d'utilisateur:</label>
            <input type="text" id="username" name="user_username" class="form-control" required />
        </div>

        <div class="mb-3">
            <label for="dob" class="form-label">Date de naissance:</label>
            <input type="date" id="dob" name="user_dob" class="form-control" required />
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Mot de passe:</label>
            <input type="password" id="password" name="user_password" class="form-control" required />
        </div>

        <button type="submit" class="btn btn-primary">S'inscrire</button>
    </form>
</div>
</body>
</html>
