<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changer votre mot de passe </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
<h2>Changer votre mot de passe</h2>
<!-- Formulaire de demande de réinitialisation du mot de passe -->
<form id="forgotPassword">
    <label for="email">Adresse email:</label>
    <input type="email" id="email" required>

    <button type="submit">Réinitialiser le mot de passe</button>
    <button type="button" onclick="window.location.href = 'index.html'">Retour</button>
</form>

<!-- Lien vers le script JS externe -->
<script src="../app/Forgot-password.js"></script>
</body>
</html>
