<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page de Connexion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="form-container">
    <h1 class="mb-4 text-center">Connexion</h1>
    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">Nom d'utilisateur:</label>
        <input type="text" id="username" name="username" class="form-control" size="50" required minlength="5" />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Mot de passe:</label>
        <input type="password" id="password" name="password" class="form-control" size="50" required minlength="10" />
      </div>
      <button type="submit" class="btn btn-primary w-100">Se connecter</button>
    </form>
    <div class="mt-3 text-center">
      <a href="Forgot-password.html">Mot de passe oublié ?</a>
    </div>
    <div class="mt-2 text-center">
      <a href="Register.html">Je m'inscris</a>
    </div>
  </div>
</div>
<script src="../app/Login.js" defer></script>
</body>
</html>
