<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Page detail d'un livre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

<div class="container">
    <h1 id="bookTitle">Titre du livre</h1>

    <h3 id="bookAuthor">Auteur : </h3>
    <h3 id="bookDate">Date de publication :</h3>
    <h3>Description détaillée :</h3>
    <p id="bookDescription">Synopsis : </p>
    <br>
    <img id="bookCover" src="" alt="Couverture du livre">
    <h3 id="bookCategory">Genre : </h3>

    <label for="status">Ajouter ce livre :</label>
    <select name="status" id="status">
        <option value="En cours ">En cours</option>
        <option value="A lire">A lire</option>
        <option value="Déja lu">Déja lu</option>
    </select>

    <h3 id="bookNote">Note et avis :</h3>
    <button onclick="window.location.href='bookList.html'" type="button">Retour</button>
</div>
<script src="../app/bookDetail.js" defer></script>
</body>
</html>
