<br>
<h1 id="title" class="text-center">👤 Profil</h1>

<br>

<div class="container" id="formUpdateProfil">
    <h1 class="mb-4">✏️ Modifier mes informations</h1>
<form action="/ma-page-de-traitement" id="idUpdateProfil" method="post">
    <div class="mb-3">
            <label for="name">Nom&nbsp;:</label>
            <input type="text" id="name" name="name" />
    </div>

    <div class="mb-3">
            <label for="lastname">Prenom&nbsp;:</label>
            <input type="text" id="lastname" name="lastname" />
    </div>
    <div class="mb-3">
        <label for ="username">Nom d'utilisateur&nbsp;</label>
        <input type="text" id="username" name="username" />
    </div>
    <div class="mb-3">
        <label for="dob" class="form-label">Date de naissance:</label>
        <input type="date" id="dob" name="birthday" class="form-control"/>
    </div>

    <div class="mb-3">
        <label for="mail">E-mail&nbsp;:</label>
        <input type="email" id="mail" name="user_mail" />
    </div>
    <div class="mb-3">
        <label for="password">Mot de passe&nbsp;:</label>
        <input type="password" id="password" name="password" class="form-control"/>
    </div>
    <div class="mb-3">
        <label for="confirmPassword">Confirmation mot de passe&nbsp;:</label>
        <input type="password" id="confirmPassword" name="password" class="form-control"/>
    </div>
        <br>
        <div class="mb-3">
            <h3>Changer votre avatar</h3>
            <label for="avatars">Choisissez un fichier :</label>
            <input type="file" id="avatars" name="avatars" accept="image/*">
        </div>
    <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
</form>
</div>
<script src="../app/profil.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
