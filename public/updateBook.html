<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changer le status du livre </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/updateBook.css">
    <link rel="stylesheet" href="css/navBar.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="Index.html">📚 BookMaster</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="Index.html">Accueil</a></li>
                <li class="nav-item"><a class="nav-link" href="BookList.html">Catalogue</a></li>
            </ul>
        </div>
    </div>
</nav>

<p>Tu peux changer le status du livre dans cette interface... </p>

<div id="bookContainer">
   <div class="infoBlock" id="divSelect">
        <label for="statusSelect">Statut :</label>
        <select id="statusSelect">
            <option value="">Selectionner ▼</option>
            <option value="A lire">À lire</option>
            <option value="En cours">En cours</option>
            <option value="Déja lu">Déjà lu</option>
    </select>
   </div>
    <br>
    <br>
    <div class="infoBlock" id="divSelectPage">
        <label for="currentPageSelect">Page actuel :</label>
        <select id="currentPageSelect"></select>
    </div>
    <br>
    <br>
    <br>
        <div class="infoBlock" id="divText">
        <textarea placeholder="Laisse une petite note perso sur ce livre..."></textarea>
            <blockquote class="quote">"Un lecteur vit mille vies avant de mourir." – George R. R. Martin</blockquote>
        <br>
    </div>
    <div id="divProgressBar">
        <progress id="progressBar"></progress>
        <p id="progressInfo">Chargement...</p>
    </div>
    <div class="infoBlock" id="divButtoon">
        <button id="submitUpdateButton" type="submit">Enregistrer</button>
        <button onclick="window.location.href='UserSpace.html'" type="button">Retour</button>
        <br>
        <br>
        <button id="deleteBook" type="submit">Supprimer</button>
        <br>
        <br>
    </div>
</div>
<script src="../app/UpdateBook.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
